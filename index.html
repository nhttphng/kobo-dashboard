<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Kobo Dashboard | Calendar and Schedule</title>
    <script>
      // Global configuration - loaded from API via .env settings
      let APP_CONFIG = {};

      /**
       * Load app configuration from API
       */
      async function loadAppConfig() {
        try {
          const response = await fetch("/api/config");
          if (response.ok) {
            APP_CONFIG = await response.json();
            // Set CSS variables for responsive dimensions
            if (APP_CONFIG.screenshotWidth && APP_CONFIG.screenshotHeight) {
              document.documentElement.style.setProperty("--dashboard-width", APP_CONFIG.screenshotWidth + "px");
              document.documentElement.style.setProperty("--dashboard-height", APP_CONFIG.screenshotHeight + "px");
            }
          }
        } catch (error) {
          console.log("Using default timezone configuration");
        }
      }

      /**
       * Get current date info for calendar rendering.
       * @returns {{year: number, month: number, monthName: string, daysInMonth: number, firstDayOfWeek: number}}
       */
      function getCurrentDateInfo() {
        const now = new Date();
        const timeZone = APP_CONFIG.timezone || "America/Regina";

        const formatter = new Intl.DateTimeFormat("en-US", {
          timeZone,
          hour12: false,
          year: "numeric",
          month: "numeric", // 1-12
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });

        const parts = formatter.formatToParts(now);
        const year = parseInt(parts.find((p) => p.type === "year").value, 10);
        const month = parseInt(parts.find((p) => p.type === "month").value, 10) - 1; // Convert to 0-indexed
        const day = parseInt(parts.find((p) => p.type === "day").value, 10);
        const hour = parseInt(parts.find((p) => p.type === "hour").value, 10);
        const minute = parseInt(parts.find((p) => p.type === "minute").value, 10);

        // We use UTC methods here to prevent the Docker host timezone from shifting the day
        const firstDayUtc = new Date(Date.UTC(year, month, 1));
        const firstDayOfWeek = firstDayUtc.getUTCDay(); // 0=Sun, 1=Mon, etc.

        // Safely calculate total days in that specific month
        const daysInMonth = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();

        // Get the localized month name
        const monthName = new Date(Date.UTC(year, month, 1)).toLocaleString(APP_CONFIG.localeString || "en-GB", {
          month: "long",
          timeZone,
        });

        return {
          year,
          month, // 0-indexed (Jan = 0)
          monthName,
          daysInMonth,
          firstDayOfWeek,
          day,
          hour,
          minute,
        };
      }

      /**
       * Render the calendar table for the current month/year.
       */
      function renderCalendar() {
        const info = getCurrentDateInfo();
        document.querySelector(".calendar__month").textContent = info.monthName;
        document.querySelector(".calendar__year").textContent = info.year;

        const tbody = document.querySelector(".calendar__table tbody");
        tbody.innerHTML = "";
        let day = 1;
        let weeks = [];
        for (let row = 0; day <= info.daysInMonth; row++) {
          let tr = document.createElement("tr");
          for (let col = 0; col < 7; col++) {
            let td = document.createElement("td");
            td.className = "calendar__date";
            if (row === 0 && col < info.firstDayOfWeek) {
              td.textContent = "";
            } else if (day <= info.daysInMonth) {
              td.textContent = day;
              // Highlight today
              if (day === info.day ) {
                td.classList.add("calendar__date--today");
              }
              day++;
            } else {
              td.textContent = "";
            }
            tr.appendChild(td);
          }
          weeks.push(tr);
        }
        weeks.forEach((tr) => tbody.appendChild(tr));
      }

      function renderSchedule(calendarEvents) {
        const schedule = document.querySelector(".schedule");

        // Clear any previous events
        schedule.innerHTML = "";

        const now = new Date();
        let tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        const dates = [now, tomorrow];
        const timeZone = APP_CONFIG.timezone || "America/Regina";

        dates.forEach(function(date) {
          const dayDiv = document.createElement("div");
          dayDiv.className = "schedule__day";

          const weekdayDiv = document.createElement("div");
          weekdayDiv.className = "date__weekday";
          weekdayDiv.textContent = date.toLocaleDateString(APP_CONFIG.localeString || "en-US", {
            weekday: "long",
            timeZone,
          });

          const dateDiv = document.createElement("div");
          dateDiv.className = "date__date";
          dateDiv.textContent = date.toLocaleDateString(APP_CONFIG.localeString || "en-US", {
            day: "numeric",
            timeZone,
          });

          const dayHeaderDiv = document.createElement("div");
          dayHeaderDiv.className = "schedule__date";
          dayHeaderDiv.appendChild(weekdayDiv);
          dayHeaderDiv.appendChild(dateDiv);

          const timelineDiv = document.createElement("div");
          timelineDiv.className = "schedule__timeline";

          dayDiv.appendChild(dayHeaderDiv);
          dayDiv.appendChild(timelineDiv);
          schedule.appendChild(dayDiv);

          renderScheduleEvents(calendarEvents, date, timelineDiv, timeZone);
        });
      }

      function renderScheduleEvents(events, date, timeline, timeZone) {
        // Filter events that equal date
        const todayEvents = events.filter((event) => {
          // 1. Core target comparison date formatted to YYYY-MM-DD
          const targetDateString = new Intl.DateTimeFormat(APP_CONFIG.localeString || "en-US", {
            timeZone,
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
          }).format(date); // Output format: YYYY-MM-DD

          // 2. Handle All-Day Events
          if (event.start.date) {
            return event.start.date === targetDateString;
          }

          // 3. Handle Timed Events (Locks the timestamp conversion to the target time zone)
          if (event.start.dateTime) {
            const eventDate = new Date(event.start.dateTime);
            const formattedEventDate = new Intl.DateTimeFormat(APP_CONFIG.localeString || "en-US", {
              timeZone,
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
            }).format(eventDate);

            return formattedEventDate === targetDateString;
          }

          return false;
        });

        if (todayEvents.length === 0) {
          const emptyDiv = document.createElement("div");
          emptyDiv.className = "schedule__event";
          emptyDiv.textContent = "No events today";
          timeline.appendChild(emptyDiv);
          return;
        }

        todayEvents.forEach((event) => {
          const timeDiv = document.createElement("div");
          timeDiv.className = "schedule__event-time";

          const start = event.start.dateTime;
          const end = event.end.dateTime;

          // 1. Identify if it is an all-day event
          if (!start.includes('T') && !end.includes('T')) {
            timeDiv.textContent = "All day";
          } else {
            // 2. Handle timed events safely
            const startTime = new Date(start);
            const endTime = new Date(eend);

            const startStr = startTime.toLocaleTimeString(APP_CONFIG.localeString || "en-GB", {
              hour: "2-digit",
              minute: "2-digit",
              hour12: false,
              timeZone: "America/Regina",
            });

            const endStr = endTime.toLocaleTimeString(APP_CONFIG.localeString || "en-GB", {
              hour: "2-digit",
              minute: "2-digit",
              hour12: false,
              timeZone: "America/Regina",
            });

            timeDiv.textContent = `${startStr} - ${endStr}`;
          }

          const eventDiv = document.createElement("div");
          eventDiv.className = "schedule__event";

          const headerDiv = document.createElement("div");
          headerDiv.className = "schedule__event-header";

          const titleDiv = document.createElement("div");
          titleDiv.className = "schedule__event-title";
          titleDiv.textContent = event.summary || "Untitled event";

          // Add calendar source indicator
          const sourceDiv = document.createElement("div");
          sourceDiv.className = "schedule__event-source";
          if (event.calendarSource) {
            // Show a simplified version of the calendar ID
            const sourceName = event.calendarSource.includes("@")
              ? event.calendarSource.split("@")[0]
              : event.calendarSource;
            sourceDiv.textContent = sourceName;
          }

          headerDiv.appendChild(timeDiv);
          if (event.calendarSource) {
            headerDiv.appendChild(sourceDiv);
          }
          eventDiv.appendChild(headerDiv);
          eventDiv.appendChild(titleDiv);
          timeline.appendChild(eventDiv);
        });
      }

      /**
       * Initialize dashboard: calendar.
       */
      async function initDashboard() {
        // Load configuration first
        await loadAppConfig();

        renderCalendar();

        // Set up Calendar API response and rendering
        try {
          const calendarEvents = await loadGoogleCalendarApi();
          renderSchedule(calendarEvents);
        } catch (err) {
          // const timeline = document.querySelector(".schedule__timeline");
          // timeline.innerHTML =
          //   '<div class="schedule__event">Failed to load calendar</div>';
          // console.error("Calendar load error:", err);
        }

        /**
         * Load Google Calendar API data from API endpoint
         */
        async function loadGoogleCalendarApi() {
          const response = await fetch("/api/calendar");
          if (!response.ok) throw new Error("Failed to load calendar data");
          return await response.json();
        }
      }

      document.addEventListener("DOMContentLoaded", initDashboard);
    </script>

    <style>
      @font-face {
        font-family: "Montserrat";
        src: url("./Montserrat-Variable.ttf") format("truetype");
        font-weight: 100 900; /* covers the full variable range */
        font-style: normal;
      }

      *,
      html > *,
      body > * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Montserrat";
        font-size: var(--dashboard-font-size, 18px);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: white;
        border: solid 1px black;
        width: var(--dashboard-width, 600px);
        height: var(--dashboard-height, 800px);
      }

      .dashboard {
        height: 100%;
        padding: 24px;
        width: 100%;
      }

      .schedule {
        display: flex;
        flex-direction: column;
      }

      .schedule__event {
        border: 1px solid black;
        padding: 8px 16px;
      }

      .schedule__event-header {
        display: flex;
        gap: 24px;
        justify-content: space-between;
        margin-bottom: 4px;
      }

      .schedule__event-time {
        font-weight: 700;
      }

      .schedule__event-source {
        font-size: 16px;
        font-style: italic;
      }

      .schedule__day {
        display: flex;
        flex-direction: column;
        gap: 12px;
        height: 100%;
        margin: 16px 0;
      }

      .schedule__date {
        display: flex;
        justify-content: space-between;
        font-weight: bold;
        line-height: 1;
        text-transform: uppercase;
      }

      .schedule__weekday {
        text-transform: uppercase;
        text-align: center;
        font-weight: bold;
      }

      .schedule__timeline {
        display: flex;
        flex-direction: column;
        gap: 16px;
        grid-row: 2;
      }

      .calendar-container {
        border-bottom: 1px solid black;
        margin-bottom: 16px;
      }

      .calendar {
        display: flex;
        flex-direction: column;
        margin-bottom: 24px;
      }

      .calendar__weekday {
        padding: 0 15px;
      }

      .calendar__title {
        align-items: center;
        border-bottom: 1px dotted black;
        display: flex;
        gap: 30px;
        justify-content: space-between;
        margin-bottom: 24px;
        padding-bottom: 16px;
      }

      .calendar__date {
        padding: 8px;
        text-align: center;
      }

      .calendar__date--today {
        background: #e0e0e0;
        font-weight: bold;
      }

      .dashboard__timestamp {
        position: absolute;
        bottom: 20px;
        right: 20px;
        font-size: 24px;
        color: #666;
        font-weight: normal;
      }
    </style>
  </head>
  <body>
    <div class="dashboard">
      <div class="calendar-container">
        <!-- Placeholder for calendar -->
        <div class="calendar">
          <div class="calendar__title">
            <h2 class="calendar__month">August</h2>
            <h2 class="calendar__year">2025</h2>
          </div>
          <table class="calendar__table">
            <thead>
              <tr>
                <th class="calendar__weekday">Sun</th>

                <th class="calendar__weekday">Tue</th>
                <th class="calendar__weekday">Wed</th>
                <th class="calendar__weekday">Thu</th>
                <th class="calendar__weekday">Fri</th>
                <th class="calendar__weekday">Sat</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="calendar__date">1</td>
                <td class="calendar__date">2</td>
                <td class="calendar__date">3</td>
                <td class="calendar__date">4</td>
                <td class="calendar__date">5</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="schedule">
        <!-- Placeholder for Date -->
        <div class="schedule__day">
          <div class="schedule__date">
            <div class="date__weekday">Tuesday</div>
            <div class="date__date">July 28, 2026</div>
          </div>

          <!-- Placeholder for calendar events -->
          <div class="schedule__timeline">
            <div class="schedule__event">
              <div class="schedule__event-header">
                <div class="schedule__event-time">08:00 - 09:00</div>
                <div class="schedule__event-source">Appointments</div>
              </div>
              <div class="schedule__event-title">Morning Meeting</div>
            </div>
          </div>
        </div>

        <div class="schedule__day">
          <div class="schedule__date">
            <div class="date__weekday">Tuesday</div>
            <div class="date__date">July 28, 2026</div>
          </div>

          <!-- Placeholder for calendar events -->
          <div class="schedule__timeline">
            <div class="schedule__event">
              <div class="schedule__event-header">
                <div class="schedule__event-time">08:00 - 09:00</div>
                <div class="schedule__event-source">Main</div>
              </div>
              <div class="schedule__event-title">Morning Meeting</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
